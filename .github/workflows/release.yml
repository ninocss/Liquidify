name: Liquidify Release

on:
  push:
    tags: ['v*-beta*', 'v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liquidify-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate prepared patch payload and release identity
        run: |
          python tools/validate_release.py
          python - <<'PY'
          import json, os
          release=json.load(open('release.json'))
          if os.environ['GITHUB_REF_TYPE']=='tag':
              assert os.environ['GITHUB_REF_NAME']==release['tag'], 'Tag must match release.json'
          PY
      - name: Decode stable signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.LIQUIDIFY_SIGNING_KEYSTORE }}
        run: |
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/liquidify-release.jks"
      - name: Test and build Liquidify Manager
        working-directory: radiant-base/Manager
        env:
          RELEASE: 'true'
          SIGNING_STORE_FILE: ${{ runner.temp }}/liquidify-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.LIQUIDIFY_SIGNING_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.LIQUIDIFY_SIGNING_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.LIQUIDIFY_SIGNING_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace
      - name: Prepare and verify release assets
        run: |
          python - <<'PY'
          import hashlib,json,shutil
          from pathlib import Path
          r=json.load(open('release.json'));lock=json.load(open('upstream-lock.json'))
          out=Path('release-assets');out.mkdir()
          shutil.copyfile('radiant-base/Manager/app/build/outputs/apk/release/app-release.apk',out/f'Liquidify-Manager-{r["version"]}.apk')
          shutil.copyfile(r['patches'],out/'patches.zip')
          (out/'data.json').write_text(json.dumps({'tidalVersionCode':lock['tidal']['versionCode'],'tidalApkUrl':lock['tidal']['url'],'patchesVersion':r['version']},indent=2)+'\n')
          files=sorted(out.iterdir())
          (out/'SHA256SUMS').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in files))
          PY
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose release-assets/Liquidify-Manager-*.apk
          "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump badging release-assets/Liquidify-Manager-*.apk > release-assets/manager-badging.txt
          head -n 5 release-assets/manager-badging.txt
          rm release-assets/manager-badging.txt
          (cd release-assets && sha256sum --check SHA256SUMS)
      - name: Retain tested assets
        uses: actions/upload-artifact@v4
        with:
          name: liquidify-release
          path: release-assets/*
      - name: Publish complete GitHub Beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(python -c 'import json;print(json.load(open("release.json"))["tag"])')
          title=$(python -c 'import json;print(json.load(open("release.json"))["title"])')
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "$title" --notes-file RELEASE_NOTES.md --draft --prerelease
          fi
          gh release upload "$tag" release-assets/* --clobber
          gh release edit "$tag" --draft=false --prerelease --title "$title" --notes-file RELEASE_NOTES.md
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/liquidify-release.jks"
